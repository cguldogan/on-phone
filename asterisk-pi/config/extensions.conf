[general]
static=yes
writeprotect=yes

[internal]
; extension-to-extension: ring 25s, then voicemail
exten => _100X,1,NoOp(Call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},25)
 same => n,VoiceMail(${EXTEN}@default,${IF($["${DIALSTATUS}"="BUSY"]?b:u)})
 same => n,Hangup()

; 600 = echo test, 601 = playback test
exten => 600,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()
exten => 601,1,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()

; *97 = your voicemail (default PIN = your extension number)
exten => *97,1,Answer()
 same => n,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

; 700 = the coding agent. The agent-phone server (ARI app "agentphone") answers, routes the call to
; the caller's listening Claude Code session and takes the instruction. If the server is down, say so.
exten => 700,1,NoOp(Phone in to the coding agent)
 same => n,Stasis(agentphone,inbound)
 same => n,GotoIf($["${STASISSTATUS}"="SUCCESS"]?done)
 same => n,Answer()
 same => n,Playback(ss-noservice)
 same => n(done),Hangup()
